appId: com.chaoo.beanwise
productName: BeanWise
directories:
  output: dist
files:
  - out/**            # Vite 构建产物
  - package.json
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
npmRebuild: false  # better-sqlite3 13.x 带 in-tarball N-API prebuild（Electron 43 验证加载），无需编译
extraResources:
  # M2：PyInstaller 产物打入安装包（resources/python/beancount-engine.exe，M3 PythonSvc 定位点）
  - from: dist-python/beancount-engine.exe
    to: python/
publish:
  provider: github    # electron-updater 从 GitHub Releases 读 latest.yml
  owner: raychaoo
  repo: BeanWise
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
