name: Build & Release

on:
  push:
    tags:
      - "v*"                  # 打 tag 触发完整构建 + 发布
  pull_request:
    branches:
      - main                  # PR 触发测试 + 构建验证（不发布）

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true    # 同一分支的新提交自动取消旧任务

env:
  NODE_VERSION: "22"          # LTS
  PYTHON_VERSION: "3.11"      # 与 tech-stack.md 锁定版本一致

jobs:
  # ─────────────────────────── 1. 单元测试 ───────────────────────────
  test:
    name: Unit tests (Vitest + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install Node deps
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Install Python deps
        run: pip install -r python/requirements-dev.txt

      - name: Python engine tests
        run: pytest python/tests

  # ─────────────────────────── 2. 端到端测试 ─────────────────────────
  e2e:
    name: E2E (Playwright + Electron)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: pip install -r python/requirements.txt

      # Electron 与 chromium 共享系统依赖，--with-deps 一并安装
      - name: Install Playwright system deps
        run: npx playwright install --with-deps chromium

      # Linux 无头环境需要 xvfb 才能启动 Electron 窗口
      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e

  # ─────────────────────────── 3. Windows 构建 ───────────────────────
  build:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [test, e2e]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Node deps
        run: npm ci

      - name: Install Python deps
        run: pip install -r python/requirements.txt pyinstaller

      # 注意：PyInstaller 输出目录必须设置为 dist-python/，
      # 避免与 electron-builder 的 dist/ 输出目录冲突
      # （在 python/service.spec 里配置 distpath，或命令加 --distpath dist-python）
      - name: Build Python engine (PyInstaller)
        run: npm run build:python

      # 签名策略：
      # - PR（无 secrets）：禁用证书自动发现，产物不签名
      # - tag（有 secrets）：CSC_LINK Authenticode 签名
      # - 统一 --publish never：发布交给 release job 汇总，避免重复发布
      - name: Build installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"        # 只认 CSC_LINK，不扫系统证书库
          CSC_LINK: ${{ secrets.CSC_LINK }}           # Authenticode 签名证书（p12 base64）
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # ─────────────────────────── 4. 发布 Release ───────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')          # 仅 tag 触发
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write                                  # 发布 Release 需要
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true                         # 合并到同一目录

      - name: Verify release files
        run: |
          ls -lh dist/
          # 必须包含 latest.yml，否则 electron-updater 静默失败
          test -f dist/latest.yml && echo "win ok"

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true                                  # 草稿，人工确认后再对外
          generate_release_notes: true