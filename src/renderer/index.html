<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeanWise</title>
    <!--
      冷启动 Splash（批次 E Task 1）：纯 CSS 自淡出，禁止任何 <script>（生产 CSP script-src 严格）。
      展示 1.2s 后 animation forwards 自动淡出至 visibility:hidden 终态；React 框架在其下方立即渲染。
      #splash 始终 pointer-events:none（不拦截 e2e 与用户点击），aria-hidden 装饰性节点。
      --bw-primary 由 styles/tokens.less 提供，回退值与 theme/tokens.ts BW_COLORS.primary 一致。
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #f5f7fa;
        pointer-events: none;
        animation: bw-splash-out 0.4s ease-out 1.2s forwards;
      }
      .bw-splash-brand {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--bw-primary, #1d39c4);
        font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      }
      .bw-splash-dots {
        display: flex;
        gap: 8px;
      }
      .bw-splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bw-primary, #1d39c4);
        opacity: 0.25;
        animation: bw-splash-breathe 1.2s ease-in-out infinite;
      }
      .bw-splash-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .bw-splash-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bw-splash-breathe {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes bw-splash-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          animation: none;
          opacity: 0;
          visibility: hidden;
        }
        .bw-splash-dots span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="bw-splash-brand">BeanWise · 豆账</div>
      <div class="bw-splash-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
